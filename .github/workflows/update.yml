
name: Update data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 2"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install httpx openpyxl sqlalchemy "psycopg[binary]>=3.2,<4"

      - name: Collect ASIC data
        run: python collect.py

      - name: Import complete ASIC appointment history into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python import_asic_history.py

      - name: Import ASIC records into Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python import_asic_json.py --apply --allow-postgres

      - name: Commit updated data
        run: |
          git config user.name "saanjeev-bharat"
          git config user.email "sanjeev.bharat@gmail.com"
          git add -A leads.json
          git diff --cached --quiet || git commit -m "Update data"
          git push
