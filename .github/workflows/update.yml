name: Update data
on:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 2"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx openpyxl
      - run: python collect.py
      - name: Commit changes
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A leads.json
          git diff --cached --quiet || git commit -m "Update data"
          git push
